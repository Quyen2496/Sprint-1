<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <h1 class="login-card__title">Đăng nhập</h1>

            <form class="login-form" id="login-form" novalidate>
                <div class="login-form__group">
                    <label class="login-form__label" for="login-email">
                        Email
                    </label>

                    <input
                        class="login-form__input"
                        id="login-email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="Nhập email"
                    >

                    <p
                        class="login-form__error"
                        id="login-email-error"
                        aria-live="polite"
                    ></p>
                </div>

                <div class="login-form__group">
                    <label class="login-form__label" for="login-password">
                        Mật khẩu
                    </label>

                    <div class="login-form__password">
                        <input
                            class="login-form__input"
                            id="login-password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Nhập mật khẩu"
                        >

                        <button
                            class="login-form__toggle-password"
                            id="login-password-toggle"
                            type="button"
                            aria-label="Hiện mật khẩu"
                        >
                            Hiện
                        </button>
                    </div>

                    <p
                        class="login-form__error"
                        id="login-password-error"
                        aria-live="polite"
                    ></p>
                </div>

                <p
                    class="login-form__error login-form__error--general"
                    id="login-error"
                    role="alert"
                    aria-live="assertive"
                ></p>

                <button
                    class="login-form__submit"
                    id="login-submit"
                    type="submit"
                >
                    Đăng nhập
                </button>
            </form>

            <!-- Link giao diện để các thành viên khác tích hợp sau.
                 Không triển khai chức năng trong module Login này. -->
            <div class="login-card__links">
                <a href="#" class="login-card__link">Quên mật khẩu?</a>
                <p class="login-card__register">
                    Chưa có tài khoản?
                    <a href="#" class="login-card__link">Đăng ký</a>
                </p>
            </div>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
